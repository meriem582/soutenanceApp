{%load static%}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Utilisateurs</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{%static 'bootstrap.min.css'%}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="{%static 'style.css'%}" rel="stylesheet">
</head>

<body>
    <div class="container-fluid position-relative d-flex p-0">
        <!-- Spinner Start -->
        {%include 'fragments/spinner.html'%}
        <!-- Spinner End -->


        <!-- Sidebar Start -->
        {%include 'fragments/sideBareAdmin.html'%}
        <!-- Sidebar End -->


        <!-- Content Start -->
        <div class="content">
            <!-- Navbar Start -->
            {%include 'fragments/navBare.html'%}
            <!-- Navbar End -->

            <!-- affichage de msg lors d'un ajout, maj ou sup -->
            {%include 'fragments/messages.html'%}

            <!-- Table Start -->

            <div class="container-fluid pt-4 px-4">
                <div class="bg-secondary rounded p-4">
                    <form action="MAJUtilisateur/" method="post">
                        {%csrf_token %}
                        <div class="modal-header">
                            <h5 class="modal-title" id="ModalMAJuserLabel">Fiche Utilisateur</h5>
                        </div>
                        <div class="modal-body" style="text-align: left;">

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Email</label>
                                <input type="text" class="form-control" name="email" value="{{urechercher.email}}"
                                    readonlyx>
                            </div>
                            <div class="mb-3">
                                <label for="" class="form-label">Password</label>
                                <input type="text" class="form-control" name="password"
                                    value="{{urechercher.password}}">
                            </div>
                            <div class="mb-3">
                                <label for="" class="form-label">Type</label>
                                <input type="text" class="form-control" name="typeUser"
                                    value="{{urechercher.type_User}}" readonly>
                            </div>

                            <div class="mb-3">
                                <label for="" class="form-label">Nom</label>
                                <input type="text" class="form-control" id="" name="nom" value="{{urechercher.nom}}">
                            </div>
                            <div class="mb-3">
                                <label for="" class="form-label">Prenom</label>
                                <input type="text" class="form-control" id="" name="prenom"
                                    value="{{urechercher.prenom}}">
                            </div>

                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary" onclick="return confirm('êtes-vous sure de vouloir modifier cet utilisateur ?')" >Modifier</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Table End -->


            <!-- Footer Start -->
            {%include 'fragments/footer.html'%}
            <!-- Footer End -->
        </div>
        <!-- Content End -->

        <!-- Back to Top -->
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/chart/chart.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="lib/tempusdominus/js/moment.min.js"></script>
    <script src="lib/tempusdominus/js/moment-timezone.min.js"></script>
    <script src="lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>

    <!-- Template Javascript -->
    <script src="{%static 'js/main.js'%}"></script>
</body>

</html>
