<div class="container-fluid pt-4 px-4">
    <div class="bg-secondary5 text-center rounded p-4">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h6 class="mb-0">Dépot de mon mémoire</h6>

        </div>

        <div style="text-align: right;">
            <form action="ajoutMemoire/" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <label for="exampleInputFile" class="form-label">Description (PDF)</label>
                <input type="file" class="form-control" id="exampleInputFile" name="memoire">
                <br>
                <button type="submit" id="ajt_memoire" class="btn btn-primary">Soumettre</button>
            </form>
        </div>
        <br>

        <div class="table_body">
            <table class="table2">
                <thead>
                    <tr class="text-white">
                        <th scope="col">Etat du mémoire</th>
                        <th scope="col">Remarque</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>{{leader.etat_memoire}}</td>
                        <td>{{leader.remarque_memoire}}</td>
                        <td>
                            <a href="suprimerMemoire/{{i.id}}"><i class="fa-solid fa-trash-arrow-up fa-lg"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Récupération des dates de début et de fin
    var dateLimiteTtraitement = new Date('{{ parametre.dateLimiteTtraitement }}');

    // Fonction pour vérifier si la date actuelle est entre les dates de début et de fin
    function checkDate() {
        var currentDate = new Date();
        if (currentDate <= dateLimiteTtraitement) {
            ajt_memoire.disabled = false;  
    } else {
        ajt_memoire.disabled = true;
        console.log("la periode de depot de memoire est dépassée");
    }
}

    // Vérifier la date lors du chargement de la page
    checkDate();

    // Vérifier la date toutes les secondes (pour les mises à jour en temps réel)
    setInterval(checkDate, 1000);
</script>
