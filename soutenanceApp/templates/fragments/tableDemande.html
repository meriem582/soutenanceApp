<div class="container-fluid pt-4 px-4">
    <div class="bg-secondary5 text-center rounded p-4">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h6 class="mb-0">Les demandes</h6>
            
        </div>
        <div style="text-align: right;">
            <form action="rechercheFormation/" method="post" >
                {%csrf_token%}
                <input type="text" placeholder="Recherche selon l'id" class="bg-dark2 border-0 p-2" name="idr" style="color: white;">
                <button type="submit" class="bg-dark2 border-0 p-2 la-loupe"><i class="fa fa-search text-primary"></i></button>
            </form>
        </div>
        <br>
        <div class="table_body">
            <table class ="table2">
                <thead>
                    <tr class="text-white">
                        <th scope="col"><input class="form-check-input" type="checkbox"></th>
                        <th scope="col">ID</th>
                        <th scope="col">Leader</th>
                        <th scope="col">Binôme</th>
                        <th scope="col">Thème</th>
                        <th scope="col">Réponse</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {%for d in listeDemande%}
                    <tr>
                        <td scope="col"><input class="form-check-input" type="checkbox"></td>
                        <td>{{d.id}}</td>
                        <td>{{d.idLeader.email.nom}} {{d.idLeader.email.prenom}}</td>
                        <td>{{d.idLeader.nom_binom}} {{d.idLeader.prenom_binom}}</td>
                        <td>{{d.idTheme.intitule}}</td>
                        <td>{{d.reponse}}</td>
                        <td>
                            <a href="#"><i class="fa fa-edit text-primary"></i></a>
                        </td>
                    </tr>
                    {%endfor%}
                </tbody>
            </table>
        </div>
        
    </div>
</div>
