{%load static%}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Configuration</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" >
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <!-- <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet"> -->
    <link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">


    <!-- <link href="lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" /> -->
    <link href="{% static 'lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css' %}" rel="stylesheet">


    <!-- Customized Bootstrap Stylesheet -->
    <link href="{%static 'bootstrap.min.css'%}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="{%static 'style.css'%}" rel="stylesheet">
</head>

<body>

    <div class="container-fluid position-relative d-flex p-0">
        <!-- Spinner Start -->
        {%include 'fragments/spinner.html'%}
        <!-- Spinner End -->

        <!-- Sidebar Start -->
        {%include 'fragments/sideBareAdmin.html'%}
        <!-- Sidebar End -->

        <!-- Content Start -->
        <div class="content">
            <!-- Navbar Start -->
            {%include 'fragments/navBare.html'%}
            <!-- Navbar End -->

            <!-- affichage de msg lors d'un ajout, maj ou sup -->
            {%include 'fragments/messages.html'%}

            <!-- Table Start -->
            <div class="container-fluid pt-4 px-4">
                <div class="bg-secondary rounded p-4">
                    <form action="MAJParametre/" method="post">
                        {%csrf_token %}
                        <div class="modal-header">
                            <h5 class="modal-title" id="ModaleMAJSalleLabel">Fiche Salle</h5>
                            <input type="hidden" value="{{prechercher.id}}" name="id">
                        </div>
                        <div class="modal-body" style="text-align: left;">
                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Date début de soutenance</label>
                                <input type="date" class="form-control" name="dateDebSoutenance"
                                    value="{{prechercher.dateDebSoutenance|date:'Y-m-d'}}">
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Date fin de soutenance</label>
                                <input type="date" class="form-control" name="dateFinSoutenace"
                                    value="{{prechercher.dateFinSoutenace|date:'Y-m-d'}}">
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Duré du soutenace par minutes</label>
                                <input type="text" class="form-control" name="dureeSoutenance"
                                    value="{{prechercher.dureeSoutenance}}">
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">l'écart entre les soutenaces par
                                    minutes</label>
                                <input type="text" class="form-control" name="ecartSoutenance"
                                    value="{{prechercher.ecartSoutenance}}">
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Année du soutenance</label>
                                <input type="text" class="form-control" name="anneeSoutenance"
                                    value="{{prechercher.anneeSoutenance}}">
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Nombre maximal des domaines
                                    d'enseignant</label>
                                <input type="text" class="form-control" name="nbrDomaineEnseignant"
                                    value="{{prechercher.nbrDomaineEnseignant}}">
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Nombre maximal de minutes
                                    d'occupation
                                    d'enseignant</label>
                                <input type="text" class="form-control" name="nbrMinuteOccupEns"
                                    value="{{prechercher.nbrMinuteOccupEns}}">
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Nombre maximal de thèmes par
                                    enseignant</label>
                                <input type="text" class="form-control" name="nbrThemeEns"
                                    value="{{prechercher.nbrThemeEns}}">
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Nombre maximal de demande par
                                    leader</label>
                                <input type="text" class="form-control" name="nbrDemande"
                                    value="{{prechercher.nbrDemande}}">
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Nombre maximal de binôme encadré par
                                    enseignant</label>
                                <input type="text" class="form-control" name="nbrDemandeAccepter"
                                    value="{{prechercher.nbrDemandeAccepter}}">
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Date début de configuration
                                    enseignant</label>
                                <input type="date" class="form-control" name="dateDebConfigEns"
                                    value="{{prechercher.dateDebConfigEns|date:'Y-m-d'}}">
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Date fin de configuration
                                    enseignant</label>
                                <input type="date" class="form-control" name="dateFinConfigEns"
                                    value="{{prechercher.dateFinConfigEns|date:'Y-m-d'}}">
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Date début des demandes </label>
                                <input type="date" class="form-control" name="dateDebDem"
                                    value="{{prechercher.dateDebDem|date:'Y-m-d'}}">
                            </div>

                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Date fin des demandes </label>
                                <input type="date" class="form-control" name="dateFinDem"
                                    value="{{prechercher.dateFinDem|date:'Y-m-d'}}">
                            </div>
                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Date début des réponses </label>
                                <input type="date" class="form-control" name="dateDebRep"
                                    value="{{prechercher.dateDebRep|date:'Y-m-d'}}">
                            </div>
                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Date fin des réponses </label>
                                <input type="date" class="form-control" name="dateFinRep"
                                    value="{{prechercher.dateFinRep|date:'Y-m-d'}}">
                            </div>
                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Date debut de traitement des mémoire
                                </label>
                                <input type="date" class="form-control" name="dateDebTraitement"
                                    value="{{prechercher.dateDebTraitement|date:'Y-m-d'}}">
                            </div>
                            <div class="mb-3">
                                <label for="exampleInputEmail1" class="form-label">Date limite de traitement des mémoire
                                </label>
                                <input type="date" class="form-control" name="dateLimiteTtraitement"
                                    value="{{prechercher.dateLimiteTtraitement|date:'Y-m-d'}}">
                            </div>
                            <div class="modal-footer">
                                <button type="submit" class="btn btn-primary" onclick="return confirm('êtes-vous sure de vouloir modifier cette configuration?')">Modifier</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Table End -->


            <!-- Footer Start -->
            {%include 'fragments/footer.html'%}
            <!-- Footer End -->
        </div>
        <!-- Content End -->


        <!-- Back to Top -->
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/chart/chart.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="lib/tempusdominus/js/moment.min.js"></script>
    <script src="lib/tempusdominus/js/moment-timezone.min.js"></script>
    <script src="lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>

    <!-- Template Javascript -->
    <script src="{%static 'js/main.js'%}"></script>
</body>

</html>
